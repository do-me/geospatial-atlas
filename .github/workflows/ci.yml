name: CI Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install -f wasm-bindgen-cli --version 0.2.121

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --frozen --package geospatial-atlas

      - name: Build
        run: npm run build

      - name: Check desktop dependency lockfile
        run: npm --prefix apps/desktop ci --ignore-scripts --dry-run --no-audit --no-fund

      - name: Run type checks
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Smoke-test installed Python wheel
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl anywidget streamlit
          "$RUNNER_TEMP/wheel-smoke/bin/geospatial-atlas" --help
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "from embedding_atlas.projection import compute_projection; from embedding_atlas.widget import EmbeddingAtlasWidget; from embedding_atlas.streamlit import embedding_atlas"

      - name: Run code format check
        run: npm run check-format

      # Add -- -D warnings to treat warnings as errors once existing warnings are resolved
      - name: Run Clippy
        run: cargo clippy --workspace
